:root{--bg:#eceee9;--card:#fff;--tx:#161a20;--mu:#667085;--bd:#dcdfd8;--ac:#0e8f7e;--side:#171b22;--inp:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b2029;--tx:#e9ecf1;--mu:#9aa3b2;--bd:#2b3240;--ac:#2fc4ae;--inp:#141922}}
*{box-sizing:border-box}
body{margin:0;font:14px "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;height:100vh}
nav{width:210px;flex:none;background:var(--side);padding:16px 10px;display:flex;flex-direction:column;gap:3px}
nav h1{font-size:17px;margin:2px 10px 16px;color:#fff;letter-spacing:.2px}
nav button{background:none;border:0;color:#b9c0cd;text-align:left;padding:9px 12px;border-radius:7px;font:inherit;cursor:pointer}
nav button:hover,nav button.on{background:color-mix(in srgb,var(--side),#fff 11%);color:#fff}
nav button.on{box-shadow:inset 3px 0 0 var(--ac)}
main{flex:1;overflow:auto;padding:24px 28px}
h2{margin:0;font-size:22px}h3{margin:0 0 10px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--bd)}
th{font-weight:600;color:var(--mu);font-size:13px}
td.r{text-align:right;white-space:nowrap}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:7px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}
button.pr{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
input,select,textarea{font:inherit;color:var(--tx);background:var(--inp);border:1px solid var(--bd);border-radius:7px;padding:7px 9px;width:100%}
input:-webkit-autofill,input:-webkit-autofill:focus{-webkit-text-fill-color:var(--tx);box-shadow:0 0 0 40px var(--inp) inset;caret-color:var(--tx)}
input[list]{background-color:var(--inp);color:var(--tx)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
label{display:block;color:var(--mu);font-size:12.5px}
label input,label select{margin-top:3px;color:var(--tx)}
.mu{color:var(--mu)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpis div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
.kpis b{display:block;font-size:21px;margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.hb{display:flex;align-items:center;gap:8px;margin:7px 0}
.hb span.n{width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb i{display:block;height:12px;background:var(--ac);border-radius:3px;min-width:2px}
.hb em{font-style:normal;color:var(--mu);font-size:12.5px;white-space:nowrap}
.trend{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:8px}
.trend div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mu)}
.trend i{display:block;width:100%;background:var(--ac);border-radius:3px 3px 0 0}

function calc(q){

  const h=(+i.h||0)*(+f.timeX||1),g=(+i.g||0)*(1+(+f.waste||0)/100),n=+i.qty||1;
  const mat=g*(1+(+m.fail||0)/100)/1000*(+m.costKg||0)*(1+(+m.markup||0)/100),mac=h*(+p.costHour||0),ene=(h>0||+i.g>0)?((+p.watts||0)*h+(+p.preheatWh||0))/1000*S.kwh:0,lab=(+i.min||0)/60*S.labor;
  const c=mat+mac+ene+lab,u=c*(1+(+(f.margin??S.margin))/100);
  const mb=g/1000*(+m.costKg||0)*(1+(+m.markup||0)/100);br.mat+=mb*n;br.fail+=(mat-mb)*n;br.mac+=mac*n;br.ene+=ene*n;br.lab+=lab*n;
  cost+=c*n;price+=u*n;kg+=g*n/1000;hrs+=h*n;obj+=n;en+=ene*n;
  rows.push({name:i.name,n,unit:u,tot:u*n,mat:m.name||'-',col:m.color||'',cn:m.colorName||'',mid:i.matId||'',mt:m.type||'',fin:i.finish||'',img:i.img||'',thm:!!i.thm,pr:p.name||'-',g:+i.g||0,h,min:+i.min||0,ene});
 });
 const ex=(q.extras||[]).reduce((a,id)=>a+(+find('extras',id)?.price||0),0),sub=price+ex,disc=sub*(+q.disc||0)/100,ship=+q.ship||0,net=sub-disc+ship,vat=net*(S.useVat?S.vat:0)/100,total=net+vat,dv=+q.depV||0,dep=Math.min(total,Math.max(0,q.depT=='pct'?total*dv/100:q.depT=='eur'?dv:0));
 return{br,cost,net,vat,total,profit:net-ship-cost,kg,hrs,obj,en,disc,ex,ship,price,dep,sub,rows};
}

 const inR=d=>{const t=new Date(d);return per=='day'?d==td:per=='month'?t.getFullYear()==y&&t.getMonth()==mo:per=='year'?t.getFullYear()==y:per=='custom'?(!d1||d>=d1)&&(!d2||d<=d2):true};
 const qs=db.quotes.filter(q=>q.status=='Completato'&&inR(q.date));
 const T={o:0,rev:0,pr:0,obj:0,kg:0,h:0},byM={},byP={},cm={};
 qs.forEach(q=>{const r=q.res||calc(q);T.o++;T.rev+=r.net;T.pr+=r.profit;T.obj+=r.obj;T.kg+=r.kg;T.h+=r.hrs;
  calc(q).rows.forEach(w=>{const lb=w.mat+(w.cn?' · '+w.cn:'');if(w.col)cm[lb]=w.col;byM[lb]=(byM[lb]||0)+w.g*w.n/1000;byP[w.pr]=(byP[w.pr]||0)+w.h*w.n});});
 const hb=(o,fn,c)=>{const k=Object.entries(o).sort((a,b)=>b[1]-a[1]),mx=k[0]?.[1]||1;

 const mx=Math.max(...mv,1);

 <p class=mu style="margin-top:-4px">Contano i preventivi con stato «Completato».</p>
 <div class=two><div class=card><h3>Materiale per tipologia</h3>${dn(byM,v=>v.toFixed(2)+' kg',n=>cm[n])}</div><div class=card><h3>Tempo di stampa per stampante</h3>${dn(byP,fmtH)}</div></div>
 <div class=two><div class=card><h3>Fatturato, ultimi 12 mesi</h3><div class=trend>${mv.map((v,i)=>`<div title="${eur(v)}"><i style="height:${v/mx*100}%"></i>${MN[months[i][1]]}</div>`).join('')}</div></div>
 <div class=card><h3>Magazzino da monitorare</h3>${low.length?low.map(m=>`<div class=hb><span class=n>${esc(m.name)}</span><em>${m.stock} g rimasti (soglia ${m.alert} g)</em></div>`).join(''):'<p class=mu>Nessun materiale sotto soglia.</p>'}</div></div>`;}

 [...db.quotes].sort((a,b)=>b.num-a.num).forEach(q=>h+=`<tr><td>${q.num}<td>${q.date}<td>${esc(find('clients',q.clientId)?.name||'-')}<td>${esc(q.title)}<td><span class="st ${q.status.replace(/\s/g,'')}">${q.status}</span><td>${eur(calc(q).total)}<td class=r><button onclick="openQ('${q.id}')">Apri</button> <button onclick="printQ('${q.id}',0)">PDF</button> <button onclick="printQ('${q.id}',1)">Ordine</button> <button onclick="dup('${q.id}')">Duplica</button> <button onclick="delQ('${q.id}')">Elimina</button></tr>`);

 Q.res=calc(Q);const i=db.quotes.findIndex(x=>x.id==Q.id);
 if(i<0){db.quotes.push(Q);db.settings.seq=Math.max(db.settings.seq,Q.num+1)}else{db.quotes[i]=Q;db.settings.seq=Math.max(db.settings.seq,Q.num+1)}save();}

function qSum(){const el=$('#qsum');if(!el)return;const r=calc(Q),S=db.settings,mg=(r.net-r.ship)>0?r.profit/(r.net-r.ship)*100:0;
 const parts=[['Costo materiale',r.br.mat,'#38bdf8'],['Energia',r.br.ene,'#a78bfa'],['Ammortamento macchina',r.br.mac,'#f59e0b'],['Costo fallimento',r.br.fail,'#ef4444']];if(r.br.lab>0)parts.push(['Manodopera',r.br.lab,'#22c55e']);const tt=parts.reduce((s,x)=>s+x[1],0);let a=0;
 const g=tt>0?parts.map(x=>{const s=a/tt*100;a+=x[1];return `${x[2]} ${s}% ${a/tt*100}%`}).join(','):'var(--bd) 0 100%';
 const row=(l,v,c)=>`<div class="sr ${c||''}"><span>${l}</span><b>${v}</b></div>`;
 el.innerHTML=`<div class=card><h3>Riassunto preventivo</h3>
 <div class=kp><div><small>PROFIT</small><b>${eur(r.profit)}</b><small>Margine: ${mg.toFixed(1)}%</small></div><div><small>MATERIALE</small><b>${Math.round(r.kg*1000)} g</b></div><div><small>ORE DI STAMPA</small><b>${fmtH(r.hrs)}</b></div></div>
 <div class=dn style="margin:6px 0 12px;gap:14px;flex-wrap:nowrap;font-size:12.5px"><div class=ring style="background:conic-gradient(${g});width:92px;height:92px;flex:none"><span style="font-size:12.5px">${eur(r.cost)}</span></div><div class=lg2 style="min-width:0">${parts.map(x=>`<div><i style="background:${x[2]}"></i>${x[0]}<em>${eur(x[1])}</em></div>`).join('')}</div></div>
 ${row('Totale stampa',eur(r.price))}${row('Servizi extra',eur(r.ex))}${r.disc?row('Sconto '+Q.disc+'%','-'+eur(r.disc)):''}${row('Spedizione',eur(r.ship))}${row(S.useVat?'IVA '+S.vat+'%':'IVA',eur(r.vat))}${row('Totale finale',eur(r.total),'fin')}
 ${r.dep>0?row('Acconto',eur(r.dep))+row('Saldo',eur(r.total-r.dep)):''}
 <button class=sb2 onclick="printQ(null,0)">Esporta PDF</button><button class=sb2 onclick="printQ(null,1)">Ordine di lavorazione</button>
 <button class="go sb2" onclick="persistQ();go('quotes')">Salva e chiudi</button><button class=sb2 onclick="go('quotes')">Chiudi</button></div>`}

async function orItem(n){const i=Q.items[n];
 if(!(window.api&&api.readFile)){alert("Il posizionamento sul piatto è disponibile nell'app installata (.exe).");return}
 if(!i.src){const r=await api.pickModels();if(!r||!r.length)return;i.src=r[0]}
 if(!/\.(stl|3mf)$/i.test(i.src)||/\.gcode\.3mf$/i.test(i.src)){alert('Il posizionamento funziona con modelli STL o 3MF non ancora elaborati.');i.src='';return}
 openOrient(i.src,i.ori||{x:0,y:0,z:0},async r=>{i.ori={x:r.x,y:r.y,z:r.z};if(r.snap){i.img=r.snap;i.thm=true}if(r.dim)i.dim=r.dim;qEdit();tot();
  if(api.slice&&confirm('Vuoi rifare lo slicing con il nuovo orientamento per aggiornare tempo e peso?'))await reslice(n)})}
async function sliceNums(f){let rs=[];
 if(/\.3mf$/i.test(f.name)){const z=await unzip(await f.arrayBuffer());if(z['Metadata/slice_info.config'])rs=parseInfo(await zget(z,'Metadata/slice_info.config'));
  if(!rs.some(r=>r.h)){const gn=Object.keys(z).find(k=>/\.gcode$/i.test(k));if(gn){const t=await zget(z,gn);rs=[Object.assign(parseGcode(t.slice(0,300000)+t.slice(-300000)),{idx:1})]}}}
 else rs=[Object.assign(parseGcode(await f.slice(0,300000).text()+await f.slice(-300000).text()),{idx:1})];
 return rs.find(r=>r.h||r.g)||null}
async function reslice(n){const i=Q.items[n];let sv={};try{sv=JSON.parse(localStorage.getItem(SLK)||'{}')}catch(e){}
 $('#dlg').innerHTML='<h3>Slicing</h3><div style="text-align:center">'+A1ANIM+'<div id=slt>Preparazione…</div></div>';$('#dlg').showModal();
 try{const pr=await api.presets().catch(()=>({filament:[]}));let fil=sv.filament&&!String(sv.filament).startsWith('m:')?sv.filament:'';
  const m=find('materials',i.matId);
  if(m&&!fil){const cl=x=>x.replace(/\s*@.*$/,'').trim().toLowerCase(),ty=(m.type||'').toUpperCase(),l=pr.filament||[],p=l.find(x=>cl(x.name)==(m.name||'').trim().toLowerCase())||(ty&&(l.find(x=>(x.info&&x.info.type||'').toUpperCase()==ty&&/generic/i.test(x.name))||l.find(x=>(x.info&&x.info.type||'').toUpperCase()==ty)));if(p)fil=p.file}
  const t=await loadMesh(i.src),nm=i.src.replace(/^.*[\\/]/,'').replace(/\.[^.]+$/,'');if(!t.length)throw new Error('modello non leggibile');
  const tmp=await api.writeTemp(nm+'.stl',stlBytes(orientMesh(t,i.ori||{x:0,y:0,z:0})));
  if(api.onSlice)api.onSlice(d=>{const e=$('#slt');if(e)e.textContent='Slicing in corso…'});
  $('#slt').textContent='Slicing in corso…';
  const r=await api.slice({files:[tmp],machine:sv.machine||'',process:sv.process||'',filament:fil,support:(i.sup&&i.sup.mode)?i.sup:((sv.support&&sv.support.mode)?sv.support:undefined)});
  const x=r.results&&r.results[0];if(!x)throw new Error((r.errors&&r.errors[0])||'slicing non riuscito');
  const nums=await sliceNums(new File([x.data],nm+(x.ext=='gcode'?'.gcode':'.gcode.3mf')));
  if(nums){i.g=+nums.g.toFixed(1);i.h=+nums.h.toFixed(2)}else throw new Error('nessun dato di tempo o peso nel risultato');
 }catch(e){$('#dlg').close();alert('Slicing non riuscito: '+(e&&e.message||e));qEdit();tot();return}
 $('#dlg').close();qEdit();tot()}

async function unzip(buf){
 const u8=new Uint8Array(buf),dv=new DataView(buf);let e=u8.length-22;
 while(e>=0&&dv.getUint32(e,true)!=0x06054b50)e--;
 if(e<0)throw new Error('zip');
 const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const z={_b:u8,_d:dv};
 for(let i=0;i<n;i++){
  const fl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true);
  z[new TextDecoder().decode(u8.subarray(p+46,p+46+fl))]={m:dv.getUint16(p+10,true),c:dv.getUint32(p+20,true),o:dv.getUint32(p+42,true)};
  p+=46+fl+xl+cl;
 }
 return z;}
async function zbin(z,name){const f=z[name];if(!f)return null;const dv=z._d,o=f.o,s=o+30+dv.getUint16(o+26,true)+dv.getUint16(o+28,true),data=z._b.subarray(s,s+f.c);
 if(f.m==0)return data;return new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}
async function zget(z,name){
 const f=z[name],dv=z._d,o=f.o,s=o+30+dv.getUint16(o+26,true)+dv.getUint16(o+28,true),data=z._b.subarray(s,s+f.c);
 if(f.m==0)return new TextDecoder().decode(data);
 return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();}
function parseInfo(xml){
 const d=new DOMParser().parseFromString(xml,'text/xml');
 return [...d.getElementsByTagName('plate')].map((p,i)=>{
  const md={};[...p.children].filter(c=>c.tagName=='metadata').forEach(m=>md[m.getAttribute('key')]=m.getAttribute('value'));
  const fil=[...p.getElementsByTagName('filament')].map(f=>({type:f.getAttribute('type')||'',g:+f.getAttribute('used_g')||0}));
  return{idx:md.index||i+1,h:(+md.prediction||0)/3600,g:fil.reduce((a,f)=>a+f.g,0)||+md.weight||0,type:fil[0]?.type||''};});}
function parseGcode(t){
 const w=t.match(/total filament weight \[g\]\s*[:=]\s*([\d.]+)/i)||t.match(/total filament used \[g\]\s*[:=]\s*([\d.]+)/i),
 tm=t.match(/total estimated time:\s*([^;\n\r]+)/i)||t.match(/estimated printing time \(normal mode\)\s*=\s*([^;\n\r]+)/i)||t.match(/model printing time:\s*([^;\n\r]+)/i),
 ty=t.match(/;\s*filament_type\s*=\s*([^;\n\r]+)/i),s=tm?tm[1]:'',g=r=>{const x=s.match(r);return x?+x[1]:0};
 return{h:g(/(\d+)d/)*24+g(/(\d+)h/)+g(/(\d+)m(?!s)/)/60+g(/(\d+)s/)/3600,g:w?+w[1]:0,type:ty?ty[1].trim():''};}

const hintOf=p=>/(^|[\\/])filament([\\/]|$)/i.test(p)?'filament':/(^|[\\/])(process|print)([\\/]|$)/i.test(p)?'process':/(^|[\\/])(machine|printer)([\\/]|$)/i.test(p)?'skip':'';
function bambuAdd(list){
 let nm=0,np=0,sk=0;const v=x=>Array.isArray(x)?x[0]:x;
 list.forEach(({j,hint})=>{
  if(!j||typeof j!='object'||!j.name)return;
  const ks=Object.keys(j),kind=hint||(ks.some(k=>/^(filament_|default_filament)/.test(k))?'filament':ks.some(k=>/^(layer_height|sparse_infill_density|wall_loops|print_settings_id|enable_support)$/.test(k))?'process':'');
  if(kind=='filament'){
   if(db.materials.some(x=>x.name==j.name)){sk++;return}
   const t=String(v(j.filament_type)||((j.name+' '+(j.inherits||'')).match(/\b(PETG|PLA|ABS|ASA|TPU|PVA|HIPS|PA|PC)\b/i)||[''])[0]).toUpperCase(),c=String(v(j.default_filament_colour)||'');
   db.materials.push({id:uid(),name:j.name,type:t,costKg:+v(j.filament_cost)||0,stock:1000,cap:1000,alert:0,color:/^#[0-9a-f]{6}/i.test(c)?c.slice(0,7):'#808080'});nm++;
  }else if(kind=='process'){
   if(db.profiles.some(x=>x.name==j.name)){sk++;return}
   db.profiles.push({id:uid(),name:j.name,layer:+j.layer_height||+((String(j.name).match(/(\d+\.\d+)\s*mm/)||[])[1])||0,waste:5,margin:db.settings.margin,timeX:1});np++;
  }});
 save();
 alert(nm+np?`Importati ${nm} materiali e ${np} profili${sk?` (${sk} già presenti, saltati)`:''}.\nControlla costo al kg e colori dei materiali. Nei profili scarto (5%) e margine sono valori di partenza: Bambu Studio non li contiene.`:'Nessun elemento nuovo trovato'+(sk?` (${sk} già presenti)`:'')+'.');
 go(cur);}
async function bambuFiles(el){

async function impSlicer(el,forceMat,smap){
 const add=[],bad=[];
 for(const f of el.files){try{
  const nm=f.name.replace(/(\.gcode)?\.3mf$|\.gcode$/i,'');let rs=[],th={};
  if(/\.3mf$/i.test(f.name)){

   if(z['Metadata/slice_info.config'])rs=parseInfo(await zget(z,'Metadata/slice_info.config'));
   if(!rs.some(r=>r.h)){const gn=Object.keys(z).find(k=>/\.gcode$/i.test(k));
    if(gn){const t=await zget(z,gn);rs=[Object.assign(parseGcode(t.slice(0,300000)+t.slice(-300000)),{idx:1})]}}
  }else{rs=[Object.assign(parseGcode(await f.slice(0,300000).text()+await f.slice(-300000).text()),{idx:1})];}
